        <script>
        (function() {
        const savedTema = localStorage.getItem('tema') || 'light';
        document.documentElement.setAttribute('tema', savedTema);
	    })();
	    function cambiarTema() {
	        const html = document.documentElement;
	        const currentTema = html.getAttribute('tema');
	        const nuevoTema = currentTema === 'dark' ? 'light' : 'dark';
	        html.setAttribute('tema', nuevoTema);
	        localStorage.setItem('tema', nuevoTema);
	    }
	    function validar(){
	    const $nombre = document.getElementById("nombre");
	    const $apellido = document.getElementById("apellido");
	    const $email = document.getElementById("email");
	    const $obra = document.getElementById("obras_sociales");
	    const $dia = document.getElementById("dia");
	    const $mes = document.getElementById("mes");
	    const $anio = document.getElementById("anio");
	    let email = /^[\w.%+-]+@[\w.-]+\.[a-zA-Z]{2,}$/;
	    /*
	    ^ inicio de cadena
	    [*****] todos los caracteres que se permiten usar (en esta seccion)
	    \w representa cualquier caracter alfanumerico
	    + 1 o mas caracteres deben haber
	    @ arroba, se puede utilizar
	    \. caracter que reprsent
	    $ final de cadena
	    */
	    // Validar nombre
	    if ($nombre.value.trim() === "") {
	        $nombre.style.border = "solid red";
	    } else {
	    $nombre.style.border = "solid 1px #cccccc";
	    }
	    // Validar apellido
	    if ($apellido.value.trim() === "") {
	        $apellido.style.border = "solid red";
	    } else {
	    $apellido.style.border = "solid 1px #cccccc";
	    }
	    // Validar email
	    if ($email.value.trim() === "" || !email.test($email.value)) {
	        $email.style.border = "solid red";
	    } else {
	    $email.style.border = "solid 1px #cccccc";
	    }
	    return false;
		}
    </script>
