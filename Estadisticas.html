<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
<script>
  (function() {
    const savedTema = localStorage.getItem("tema") || "light";
    document.documentElement.setAttribute("tema", savedTema);
  })();

  function cambiarTema() {
    const html = document.documentElement;
    const currentTema = html.getAttribute("tema");
    const nuevoTema = currentTema === "dark" ? "light" : "dark";

    html.setAttribute("tema", nuevoTema);
    localStorage.setItem("tema", nuevoTema);
  }

  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById(
      "estadisticas-container"
    );

    // Los nombres deben coincidir con los del juego
    const historial = JSON.parse(localStorage.getItem("historialPartidas")) || [];

    // Recorrer el arreglo para imprimir los datos por consola como en la versión anterior
    historial.forEach((item, index) => {
      console.log(`--- Partida ${index + 1} ---`);
      console.log("juego:", item.juego);
      console.log("score:", item.score);
      console.log("total:", item.total);
      console.log("fecha:", item.fecha);
    });

    if (historial.length === 0) {
      container.innerHTML = `
        <p>No hay estadísticas disponibles.</p>
      `;
      return;
    }

    // Renderizar todas las partidas dinámicamente con sus respectivos emojis y mensajes
    container.innerHTML = historial.map(partida => {
      // Calcular porcentaje de aciertos por partida
      const porcentaje = partida.total > 0 ? (partida.score / partida.total) * 100 : 0;
      
      // Evaluar si aprobó (50% o más) para asignarle la animación/emoji adecuada
      const esGanador = porcentaje >= 50;
      const mensajeFinal = esGanador 
        ? "🎉🎉 ¡Excelente!" 
        : "😔 Sigue intentando";
      const claseEstado = esGanador ? "aprobado" : "reaprobado";

      return `
        <div class="estadistica">
          <p><strong>Juego - ${partida.juego}</strong></p>
          <p class="score">
            ${partida.score} de ${partida.total} respuestas correctas
          </p>
          <p class="mensaje-resultado ${claseEstado}">
            ${mensajeFinal}
          </p>
          <p><small>Jugado el ${partida.fecha}</small></p>
        </div>
      `;
    }).join("");
  });
</script>
