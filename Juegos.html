<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos</title>
    <style>
      .header{
      position: sticky;
      padding: 10px;
      box-shadow: 10px 10px 50px 15px black;
      border-radius: 10px;
      max-width: 490px;
      margin: 1em auto;
      background-color: #333;
      background-color: rgba(0, 0, 0, 0.5);
      font-family: Arial;
      }
      .menu ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;              
        gap: 0.5em;
      }
      .menu a { 
        padding: 10px 10px;
        background: #444;
      } 
      .menu a:hover {
        background: #222;
        text-decoration: underline #999;
      }
      a:link,a:visited{
        color: white;
        text-decoration: none;
      }
      a{
        border-radius: 50px;
        display: block;
        color: #fff;
        text-decoration: none;
        transition: background .3s;
      }
      body{
          background-color: #222;
          transition: background-color 0.15s, color 0.15s;
          text-align: middle-center;
      }
      body.dark-mode {
          background-color: white;
          color: black;
      }
      main {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          align-items: center;
          height: 70vh;
      }
      .juego {
          width: 150px;
          height: 150px;
          margin: 20px;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 20px;
          color: white;
          text-align: center;
          cursor: pointer;
          border-radius: 10px;
          transition: background-color 0.3s;
      }
      .juego:hover {
          opacity: 0.8;
      }
      .juego1 { background-color: #3498db; }
      .juego2 { background-color: #e74c3c; }
      .juego3 { background-color: #2ecc71; }
      .juego4 { background-color: #f39c12; }
  </style>
</head>
<body>
    <header class="header">
<nav class="menu">
  <ul>
    <li><a href="Inicio.html">Inicio</a></li>
    <li><a href="Juegos.html">Juegos</a></li>
    <li><a href="Estadisticas.html">Estadísticas</a></li>
    <li><a href="Sobre Nosotros.html">Sobre Nosotros</a></li>
    <li><a href="Contacto.html">Contacto</a></li>
  </ul>
</nav>
</header>
<input type=button value="Color" id="color"></input>
<main>
<div class="juego juego1" onclick="window.location.href='cultura.html'">Cultura General</div>
<div class="juego juego2" onclick="window.location.href='geografia.html'">Geografia</div>
<div class="juego juego3" onclick="window.location.href='serpiente.html'">Snake</br>(Serpiente)</div></main>
  <script>
    const color = document.getElementById('color');
    color.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    });
  </script>
</body>
</html>
